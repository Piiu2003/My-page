      <!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>अर्थ-wise</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Noto Sans Devanagari',sans-serif
}

body{
background:
linear-gradient(rgba(248,242,230,.9),rgba(248,242,230,.9)),
url("https://www.transparenttextures.com/patterns/cream-paper.png");
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.card{
background:#fffdf7;
max-width:1100px;
width:100%;
border-radius:28px;
padding:30px;
box-shadow:0 15px 40px rgba(0,0,0,.15);
border:1px solid #eadfc7
}

.title{
font-family:'Playfair Display',serif;
font-size:34px;
letter-spacing:1px;
color:#7a3e00;
margin-bottom:4px
}

.subtitle{
font-size:13px;
color:#9c7a45;
margin-bottom:25px
}

.controls{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px
}

button{
border:none;
padding:10px 18px;
border-radius:20px;
cursor:pointer;
font-weight:600
}

.primary{
background:#b85c00;
color:white
}

.secondary{
background:#f0e6d2;
color:#6b4b20
}

button:hover{opacity:.9}

.row{
display:flex;
flex-wrap:wrap;
gap:25px
}

.panel{
background:#faf6ec;
border:1px solid #efe2c8;
border-radius:18px;
padding:20px
}

.form-panel{flex:1;min-width:260px}
.list{flex:1.5;min-width:300px}

.field{
margin-bottom:12px;
display:flex;
flex-direction:column;
font-size:14px
}

input,select{
padding:10px;
border-radius:10px;
border:1px solid #ddd
}

.flow{
background:white;
padding:12px 16px;
border-radius:10px;
margin-bottom:8px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 10px rgba(0,0,0,.05)
}

.income{border-left:5px solid #2e8b57}
.expense{border-left:5px solid #c0392b}

.indicator{
margin-top:12px;
font-weight:600
}

.chartBox{margin-top:20px}

canvas{max-height:300px}

.sectionTitle{
font-weight:600;
color:#7a3e00;
margin-bottom:10px
}

</style>
</head>

<body>

<div class="card">

<div class="title">अर्थ-wise</div>
<div class="subtitle">Smart Income & Expense Tracker</div>

<div class="controls">

<button class="secondary" id="startMonth">🟢 Start New Month</button>
<button class="secondary" id="endMonth">🔴 End Month</button>

<select id="monthSelect"></select>

<button class="primary" id="showChart">📊 Expense Chart</button>
<button class="secondary" id="showTrend">📈 Income vs Expense</button>
<button class="secondary" id="closeChart">❌ Close Chart</button>

</div>

<div class="indicator" id="savingIndicator"></div>

<div class="chartBox">
<canvas id="chartCanvas"></canvas>
</div>

<div class="row">

<div class="form-panel">

<div class="panel">

<div class="sectionTitle">Add Transaction</div>

<div class="field">
<label>Description</label>
<input id="descInput">
</div>

<div class="field">
<label>Amount ₹</label>
<input type="number" id="amountInput">
</div>

<div class="field">

<label>Category</label>

<select id="catSelect">

<option>💰 Salary</option>
<option>📈 Investment</option>
<option>📆EMI</option>
<option>🍔 Food</option>
<option>🚗 Transport</option>
<option>⛽ Petrol</option>
<option>📚 Library</option>
<option>✏️ Stationary</option>
<option>🛍️ Shopping</option>
<option>💡 Bills</option>
<option>🏥 Health</option>
<option>📌 Other</option>

</select>

</div>

<label><input type="radio" name="type" value="income" checked> Income</label>
<label><input type="radio" name="type" value="expense"> Expense</label>

<br><br>

<button class="primary" id="addEntryBtn">➕ Add Entry</button>

</div>

</div>

<div class="list">

<div class="panel">

<div class="sectionTitle">Transaction History</div>

<div id="transactionList"></div>

</div>

</div>

</div>

</div>

<script>

const TX_KEY="transactions"
const MONTH_KEY="months"
const CURRENT_MONTH="currentMonth"

let transactions=JSON.parse(localStorage.getItem(TX_KEY))||[]
let months=JSON.parse(localStorage.getItem(MONTH_KEY))||[]
let currentMonth=localStorage.getItem(CURRENT_MONTH)

let chartInstance=null

function save(){
localStorage.setItem(TX_KEY,JSON.stringify(transactions))
localStorage.setItem(MONTH_KEY,JSON.stringify(months))
localStorage.setItem(CURRENT_MONTH,currentMonth)
}

function startMonth(){

const id="month_"+Date.now()

months.push({id:id,start:Date.now(),end:null})

currentMonth=id

save()
updateMonthDropdown()
render()

}

function endMonth(){

const m=months.find(x=>x.id===currentMonth)

if(!m)return

m.end=Date.now()

currentMonth=null

save()
updateMonthDropdown()

}

function addTransaction(){

if(!currentMonth){
alert("Start a month first")
return
}

const desc=document.getElementById("descInput").value
const amt=parseFloat(document.getElementById("amountInput").value)
const cat=document.getElementById("catSelect").value
const type=document.querySelector('input[name="type"]:checked').value

transactions.push({
id:Date.now(),
description:desc,
amount:amt,
category:cat,
type:type,
month:currentMonth
})

save()
render()

}

function render(){

const selected=document.getElementById("monthSelect").value||currentMonth

const list=document.getElementById("transactionList")

const data=transactions.filter(t=>t.month===selected)

if(!data.length){
list.innerHTML="No transactions yet"
return
}

list.innerHTML=data.map(t=>`
<div class="flow ${t.type}">
<div>${t.description} (${t.category})</div>
<div>${t.type==="income"?"+":"-"} ₹${t.amount}</div>
</div>
`).join("")

updateSavingIndicator(selected)

}

function updateSavingIndicator(monthId){

const data=transactions.filter(t=>t.month===monthId)

let income=0
let expense=0

data.forEach(t=>{
if(t.type==="income") income+=t.amount
else expense+=t.amount
})

if(income===0)return

const rate=((income-expense)/income)*100

const el=document.getElementById("savingIndicator")

if(rate>40){
el.innerHTML="🟢 Excellent Saving Rate: "+rate.toFixed(1)+"%"
}
else if(rate>10){
el.innerHTML="🟡 Balanced Saving: "+rate.toFixed(1)+"%"
}
else{
el.innerHTML="🔴 Overspending: "+rate.toFixed(1)+"%"
}

}

function updateMonthDropdown(){

const select=document.getElementById("monthSelect")

select.innerHTML=""

months.forEach(m=>{

const option=document.createElement("option")

option.value=m.id

option.textContent=new Date(m.start).toLocaleDateString()

select.appendChild(option)

})

}

document.getElementById("addEntryBtn").onclick=addTransaction
document.getElementById("startMonth").onclick=startMonth
document.getElementById("endMonth").onclick=endMonth
document.getElementById("monthSelect").onchange=render

updateMonthDropdown()
render()

</script>

</body>
</html>
